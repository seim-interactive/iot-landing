# Caché según la ruta, en un solo lugar: se manda con un add_header a nivel server (abajo).
# Ningún location tiene add_header propio, porque en nginx eso anula los del server y se
# perdían las cabeceras de seguridad (pasaba en la home y en /assets/).
map $uri $cache_by_uri {
    # El HTML se revalida siempre (ETag): no-cache y no no-store, que impide el bfcache
    ~\.html$                                   "no-cache";
    # Con hash en el nombre (Vite) o con ?v=<hash> en la URL (videos y pósters de la plataforma)
    ~^/assets/                                 "public, max-age=31536000, immutable";
    ~^/media/plataforma/                       "public, max-age=31536000, immutable";
    /robots.txt                                "public, max-age=3600";
    /sitemap.xml                               "public, max-age=3600";
    # Íconos e imágenes con URL fija: si cambian, se ven al día siguiente
    ~*\.(png|jpe?g|gif|ico|svg|webp|avif)$     "public, max-age=86400";
    default                                    "";
}

# La copia de la plataforma que usa la landing (/plataforma/) no es una página para el
# buscador: se puede rastrear, pero no se indexa.
map $uri $robots_tag {
    ~^/plataforma/    "noindex, nofollow";
    default           "";
}

# La caché de la ruta va solo en las respuestas que salieron bien (y redirecciones o 304):
# un error nunca queda guardado con la caché larga de /assets/. El 404 es no-cache.
map $status $cache_control {
    ~^(200|204|206|301|302|304|307|308)$    $cache_by_uri;
    404                                     "no-cache";
    default                                 "no-store";
}

server {
    listen 80;
    # Servido en https://iot.seiminteractive.io (TLS lo termina el reverse proxy de la VPS -> 127.0.0.1:8085)
    server_name iot.seiminteractive.io localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Las redirecciones de nginx (/argus → /argus/) van relativas: detrás del proxy de la VPS
    # el contenedor ve http y su puerto interno, y una absoluta mandaría a http://…
    absolute_redirect off;

    charset utf-8;
    charset_types text/plain text/xml text/css text/javascript application/javascript application/json application/xml;

    # Compresión. El reverse proxy de la VPS (nginx 1.24) le pide al contenedor en HTTP/1.0, y por
    # defecto nginx no comprime ni HTTP/1.0 (gzip_http_version 1.1) ni lo que llega por un proxy
    # con Via (gzip_proxied): por eso JS, CSS y fuentes salían sin comprimir.
    gzip on;
    gzip_vary on;
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/ld+json application/manifest+json application/xml application/rss+xml application/atom+xml image/svg+xml image/x-icon font/ttf font/otf application/vnd.ms-fontobject;

    # 404 de verdad: lo que no existe ya no devuelve la landing con 200
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Videos y pósters: ya vienen comprimidos (sin gzip) y se piden por rangos (Accept-Ranges)
    location ^~ /media/ {
        gzip off;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        access_log off;
        try_files $uri =404;
    }

    # La home: la sirve index.html (por el index de arriba)
    location = / {
    }

    # El brief y su panel se mudaron a HQ. /brief conserva el resto de la URL (el acceso de
    # 64 hex y los parámetros): ahí caen los clientes con el 301 viejo de seiminteractive.io/brief.
    location = /brief {
        return 301 https://hq.seiminteractive.io$request_uri;
    }
    location ^~ /brief/ {
        return 301 https://hq.seiminteractive.io$request_uri;
    }
    location = /admin {
        return 301 https://hq.seiminteractive.io/briefs;
    }
    location ^~ /admin/ {
        return 301 https://hq.seiminteractive.io/briefs;
    }

    # Lo demás: el archivo real, o la carpeta de una página por tema (/argus/ → argus/index.html),
    # o 404
    location / {
        try_files $uri $uri/ =404;
    }

    # Caché (ver el map de arriba) y cabeceras de seguridad. Valen para todas las respuestas
    # porque ningún location define add_header.
    add_header Cache-Control $cache_control always;
    add_header X-Robots-Tag $robots_tag always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
