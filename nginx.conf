server {
    listen 80;
    # Servido en https://iot.seiminteractive.io (TLS lo termina el reverse proxy de la VPS -> 127.0.0.1:8085)
    server_name iot.seiminteractive.io localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión. El reverse proxy de la VPS (nginx 1.24) le pide al contenedor en HTTP/1.0, y por
    # defecto nginx no comprime ni HTTP/1.0 (gzip_http_version 1.1) ni lo que llega por un proxy
    # con Via (gzip_proxied): por eso JS, CSS y fuentes salían sin comprimir.
    gzip on;
    gzip_vary on;
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/ld+json application/manifest+json application/xml application/rss+xml application/atom+xml image/svg+xml image/x-icon font/ttf font/otf application/vnd.ms-fontobject;

    # 404 de verdad: lo que no existe ya no devuelve la landing con 200
    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires epoch;
    }

    # SEO files — proper content types and short cache
    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }
    location = /sitemap.xml {
        add_header Content-Type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }

    # Assets con hash: un año, inmutables (^~ para que no les gane la regla de imágenes de abajo)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Íconos e imágenes de la raíz: URL fija, así que caché corta (si cambian, se ven al día siguiente)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2)$ {
        expires 1d;
        access_log off;
    }

    # index.html should NOT be cached (so SEO meta updates propagate)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # La home: la sirve index.html (por el index de arriba)
    location = / {
    }

    # El brief y su panel se mudaron a HQ. /brief conserva el resto de la URL (el acceso de
    # 64 hex y los parámetros): ahí caen los clientes con el 301 viejo de seiminteractive.io/brief.
    location = /brief {
        return 301 https://hq.seiminteractive.io$request_uri;
    }
    location ^~ /brief/ {
        return 301 https://hq.seiminteractive.io$request_uri;
    }
    location = /admin {
        return 301 https://hq.seiminteractive.io/briefs;
    }
    location ^~ /admin/ {
        return 301 https://hq.seiminteractive.io/briefs;
    }

    # Todo lo demás: el archivo real o 404
    location / {
        try_files $uri =404;
    }

    # Security & SEO headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
